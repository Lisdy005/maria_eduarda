name: Verificar proyecto Java
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['11', '17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Compilar, probar y empaquetar
        run: mvn -B clean verify
      - name: Regenerar datos, entrenar y evaluar JAR Maven
        run: |
          mkdir -p target/ci
          java -Dfile.encoding=UTF-8 -jar target/diagnosticador-canino.jar generar target/ci/dataset.arff
          cmp dataset.arff target/ci/dataset.arff
          java -Dfile.encoding=UTF-8 -jar target/diagnosticador-canino.jar entrenar dataset.arff target/ci/modelos
          java -Dfile.encoding=UTF-8 -jar target/diagnosticador-canino.jar experimento dataset.arff target/ci/resultados
          cmp resultados/metricas_globales.csv target/ci/resultados/metricas_globales.csv
          python3 scripts/verificar_resultados.py target/ci
          java -Dfile.encoding=UTF-8 -jar target/diagnosticador-canino.jar diagnosticar target/ci/modelos/NaiveBayes.model fiebre,vomito,diarrea
      - uses: actions/upload-artifact@v4
        with:
          name: diagnosticador-java-${{ matrix.java }}
          path: |
            target/diagnosticador-canino.jar
            target/surefire-reports/
            target/ci/resultados/
